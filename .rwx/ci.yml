  #     # Run B2 build
  #     cd boost-source
  #     ./b2 \
  #       toolset=gcc-15 \
  #       cxxstd=20 \
  #       variant=debug \
  #       address-model=64 \
  #       link=shared \
  #       cxxflags="-fsanitize=address -fsanitize=undefined -fsanitize-address-use-after-scope -fsanitize=pointer-subtract" \
  #       linkflags="-fsanitize=address -fsanitize=undefined" \
  #       libs/capy/test
  #   filter:
  #     - capy-root/**
  #   env:
  #     ASAN_OPTIONS: detect_invalid_pointer_pairs=2:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1

  - key: install-gcc-12
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-12 g++-12 build-essential git cmake

  # GCC 12: B2 build only (matches original workflow)
  - key: build-gcc-12
    use: [clone-capy, install-sccache, install-gcc-12]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-gcc-12 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-gcc12-b2"
      sccache --show-stats

      # Create sccache wrapper script and configure B2 to use it
      mkdir -p ~/sccache-wrappers
      cat > ~/sccache-wrappers/g++-12 << 'WRAPPER_EOF'
#!/bin/bash
exec sccache /usr/bin/g++-12 "$@"
WRAPPER_EOF
      chmod +x ~/sccache-wrappers/g++-12
      echo "using gcc : 12 : \$HOME/sccache-wrappers/g++-12 ;" > ~/user-config.jam

      # ===== CUSTOM CONTENT-HASH CACHING =====
      # Compute hash of capy source files (content-based, not mtime)
      cd capy-root
      CONTENT_HASH=$(find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) 2>/dev/null | sort | xargs cat 2>/dev/null | sha256sum | cut -d' ' -f1)
      CACHE_DIR="/tmp/build-cache-gcc12/$CONTENT_HASH"
      echo "📦 Content hash: $CONTENT_HASH"

      # Check if build artifacts cached
      if [ -d "$CACHE_DIR/bin.v2" ]; then
        echo "✓ CACHE HIT! Restoring build artifacts..."
        cp -r "$CACHE_DIR/bin.v2" ../boost-source/ 2>/dev/null || true
        CACHE_HIT=true
      else
        echo "✗ Cache miss - will build and cache"
        CACHE_HIT=false
      fi
      cd ..

      # Setup Boost tree with capy integrated (RWX task isolation requires inline setup)
      BUILD_START=$(date +%s)
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with partial clone to reduce download size
      git clone --depth 1 --filter=blob:none --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 --filter=blob:none tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy

      # Create root Jamfile for B2 to find the project structure
      echo "use-project /boost/capy : build ;" > libs/capy/Jamfile
      echo "build-project build ;" >> libs/capy/Jamfile
      echo "build-project test ;" >> libs/capy/Jamfile

      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      # Run B2 build (sccache caches object files, custom cache stores final binaries)
      ./b2 \
        toolset=gcc-12 \
        cxxstd=20 \
        variant=release \
        address-model=64 \
        link=shared \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Cache build artifacts if not from cache
      if [ "$CACHE_HIT" = false ] && [ -d "bin.v2" ]; then
        echo "💾 Caching build artifacts..."
        mkdir -p "$CACHE_DIR"
        cp -r bin.v2 "$CACHE_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-gcc-12 completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-gcc-12|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-gcc12-b2/**

  - key: install-gcc-13-coverage
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-13 g++-13 build-essential git cmake lcov wget unzip

  # GCC 13 coverage: CMake build only (coverage flag disables B2 in GitHub Actions)
  - key: build-gcc-13-coverage
    use: [clone-capy, install-sccache, install-gcc-13-coverage]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-gcc-13-coverage STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-gcc13-coverage"
      export CC="sccache gcc-13"
      export CXX="sccache g++-13"
      sccache --show-stats

      # ===== CUSTOM CONTENT-HASH CACHING =====
      cd capy-root
      CONTENT_HASH=$(find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) 2>/dev/null | sort | xargs cat 2>/dev/null | sha256sum | cut -d' ' -f1)
      CACHE_DIR="/tmp/build-cache-gcc13-coverage/$CONTENT_HASH"
      echo "📦 Content hash: $CONTENT_HASH"

      # Check cache
      if [ -d "$CACHE_DIR/__build__" ]; then
        echo "✓ CACHE HIT! Restoring build artifacts..."
        cp -r "$CACHE_DIR/__build__" . 2>/dev/null || true
        CACHE_HIT=true
      else
        echo "✗ Cache miss - will build and cache"
        CACHE_HIT=false
      fi

      # Build with sccache (caches object files)
      BUILD_START=$(date +%s)
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_CXX_STANDARD=20 \
        -DCMAKE_CXX_COMPILER=g++-13 \
        -DCMAKE_C_COMPILER=gcc-13 \
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
        -DCMAKE_C_COMPILER_LAUNCHER=sccache \
        -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
        -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__
      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Cache if not hit
      if [ "$CACHE_HIT" = false ] && [ -d "__build__" ]; then
        echo "💾 Caching build artifacts..."
        mkdir -p "$CACHE_DIR"
        cp -r __build__ "$CACHE_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # Generate coverage report
      lcov -c -q -o "__build__/coverage.info" -d "__build__" \
        --include "$(pwd)/*" --gcov-tool gcov-13

      # Upload to codecov
      bash <(curl -s https://codecov.io/bash) -f "__build__/coverage.info"

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-gcc-13-coverage completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-gcc-13-coverage|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-gcc13-coverage/**

  # ============================================================================
  # Linux Clang Builds (5 configurations: Clang 17, Clang 20 variants, Clang 20 x86)
  # ============================================================================

  - key: install-clang-20
    run: |
      sudo apt-get update
      sudo apt-get install -y wget gnupg software-properties-common
      wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
      sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
      sudo apt-get update
      sudo apt-get install -y clang-20 build-essential git cmake

  # Clang 20: Both B2 and CMake builds (matches build-cmake: true in GitHub Actions)
  # Split into C++20 and C++23 builds to keep each task <2min
  - key: build-clang-20-b2-cxx20
    use: [clone-capy, install-sccache, install-clang-20]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-b2-cxx20 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-b2-cxx20"
      sccache --show-stats

      # Create sccache wrapper script and configure B2 to use it
      mkdir -p ~/sccache-wrappers
      cat > ~/sccache-wrappers/clang++-20 << 'WRAPPER_EOF'
#!/bin/bash
exec sccache /usr/bin/clang++-20 "$@"
WRAPPER_EOF
      chmod +x ~/sccache-wrappers/clang++-20
      echo "using clang : 20 : \$HOME/sccache-wrappers/clang++-20 ;" > ~/user-config.jam

      # ===== CUSTOM CONTENT-HASH CACHING =====
      # Compute hash of capy source files (content-based, not mtime)
      cd capy-root
      CONTENT_HASH=$(find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) 2>/dev/null | sort | xargs cat 2>/dev/null | sha256sum | cut -d' ' -f1)
      CACHE_DIR="/tmp/build-cache-clang20-b2-cxx20/$CONTENT_HASH"
      echo "📦 Content hash: $CONTENT_HASH"

      # Check if build artifacts cached
      if [ -d "$CACHE_DIR/bin.v2" ]; then
        echo "✓ CACHE HIT! Restoring build artifacts..."
        mkdir -p ../boost-source
        cp -r "$CACHE_DIR/bin.v2" ../boost-source/ 2>/dev/null || true
        CACHE_HIT=true
      else
        echo "✗ Cache miss - will build and cache"
        CACHE_HIT=false
      fi
      cd ..

      # Setup Boost tree with capy integrated (RWX task isolation requires inline setup)
      BUILD_START=$(date +%s)
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with partial clone to reduce download size
      git clone --depth 1 --filter=blob:none --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 --filter=blob:none tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy

      # Create root Jamfile for B2 to find the project structure
      echo "use-project /boost/capy : build ;" > libs/capy/Jamfile
      echo "build-project build ;" >> libs/capy/Jamfile
      echo "build-project test ;" >> libs/capy/Jamfile

      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      # Run B2 build for C++20 only (sccache caches object files)
      ./b2 \
        toolset=clang-20 \
        cxxstd=20 \
        variant=release \
        address-model=64 \
        link=shared \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Cache build artifacts if not from cache
      if [ "$CACHE_HIT" = false ] && [ -d "bin.v2" ]; then
        echo "💾 Caching build artifacts..."
        mkdir -p "$CACHE_DIR"
        cp -r bin.v2 "$CACHE_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-clang-20-b2-cxx20 completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-clang-20-b2-cxx20|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-clang20-b2-cxx20/**

  - key: build-clang-20-b2-cxx23
    use: [clone-capy, install-sccache, install-clang-20]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-b2-cxx23 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-b2-cxx23"
      sccache --show-stats

      # Create sccache wrapper script and configure B2 to use it
      mkdir -p ~/sccache-wrappers
      cat > ~/sccache-wrappers/clang++-20-cxx23 << 'WRAPPER_EOF'
#!/bin/bash
exec sccache /usr/bin/clang++-20 "$@"
WRAPPER_EOF
