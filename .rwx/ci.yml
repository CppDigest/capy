      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-cmake STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-cmake"
      export CC="sccache clang-20"
      export CXX="sccache clang++-20"
      sccache --show-stats

      # ===== INCREMENTAL BUILD CACHING =====
      # Use workspace-relative artifacts to enable CMake incremental compilation
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-clang20-cmake"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"

      cd capy-root
      # Restore previous build artifacts if they exist
      if [ -d "$ARTIFACTS_DIR/__build__" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/__build__" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Build
      BUILD_START=$(date +%s)
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_CXX_STANDARD=23 \
        -DCMAKE_CXX_COMPILER=clang++-20 \
        -DCMAKE_C_COMPILER=clang-20 \
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__
      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "__build__" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r __build__ "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-clang-20-cmake completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-clang-20-cmake|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
