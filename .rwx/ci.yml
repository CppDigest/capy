  # Clang 20 asan+ubsan: B2 build only
  - key: build-clang-20-asan-ubsan
    use: [clone-capy, install-sccache, install-clang-20]
    env:
      SCCACHE_CACHE_SIZE: 1G
      ASAN_OPTIONS: detect_invalid_pointer_pairs=0:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-asan-ubsan STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-asan"
      sccache --show-stats

      # Setup Boost tree with capy integrated
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with shallow clone
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy
      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      # ===== INCREMENTAL BUILD CACHING =====
      # Restore previous build artifacts AFTER Boost tree setup (enables incremental builds)
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-clang20-asan"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"
      if [ -d "$ARTIFACTS_DIR/bin.v2" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/bin.v2" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Disable ASLR for sanitizers
      sudo sysctl vm.mmap_rnd_bits=28 || true

      # Run B2 build (sccache caches object files, artifacts enable incremental builds)
      BUILD_START=$(date +%s)
      ./b2 \
        toolset=clang-20 \
        cxxstd=20 \
        variant=debug \
        address-model=64 \
        link=static \
        cxxflags="-fsanitize=address -fsanitize=undefined -fsanitize-address-use-after-scope -fsanitize=pointer-subtract" \
        linkflags="-fsanitize=address -fsanitize=undefined" \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "bin.v2" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r bin.v2 "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-clang-20-asan-ubsan completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-clang-20-asan-ubsan|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
