#
# RWX CI Configuration for Boost.Capy
# Migrated from GitHub Actions workflow
#
# This configuration uses RWX's DAG-based execution with content-based caching
# to optimize the build matrix for faster CI turnaround.
#
# PREREQUISITES:
# 1. RWX account setup with organization created
# 2. GitHub App created in RWX Vault named 'CppDigest' with app slug 'cppdigest-test'
#    - Vault name: CppDigest
#    - GitHub App slug: cppdigest-test
#    - Required permissions: Contents (Read & Write), Pull Requests (Read & Write)
# 3. GitHub App installed on CppDigest/capy repository
#
# CURRENT STATUS:
# - Linux builds (5 configurations): GCC 12/13, Clang 17/20 with variants
#   - GCC 12 (B2), GCC 13 coverage (CMake), Clang 17 (B2), Clang 20 (B2+CMake), Clang 20 x86 (B2)
#   - Target time: 5-10 minutes with RWX caching for B2 builds
# - GCC 15 builds (3 configurations): Remain in GitHub Actions (require Ubuntu 25.04)
# - Windows/macOS builds (4 configurations): Require platform-specific runner setup
#
# HYBRID CI APPROACH:
# - RWX CI: Handles Ubuntu 24.04-compatible builds (5 Linux configurations)
# - GitHub Actions: Handles GCC 15 (Ubuntu 25.04), Windows, macOS builds
#
# USAGE:
# - Test locally: rwx run .rwx/ci.yml --init commit-sha=HEAD
# - Auto-triggers on push/PR once committed to default branch
#

on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        clone-url: ${{ event.github.push.repository.clone_url }}
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        clone-url: ${{ event.github.pull_request.head.repo.clone_url }}
  cli:
    init:
      commit-sha: HEAD

# Base configuration applied to all tasks
base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ============================================================================
  # Base Setup Tasks (shared dependencies)
  # ============================================================================

  - key: clone-capy
    call: git/clone 2.0.2
    with:
      ref: ${{ init.commit-sha }}
      repository: https://github.com/CppDigest/capy.git
      path: capy-root
      preserve-git-dir: true

  # Shared sccache installation (distributed compiler cache)
  # sccache supports local disk cache (default) or cloud backends (S3, GCS, Redis)
  # For distributed caching, set: SCCACHE_BUCKET, SCCACHE_REGION, AWS credentials
  - key: install-sccache
    run: |
      wget https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz
      tar xzf sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz
      sudo mv sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/
      chmod +x /usr/local/bin/sccache
      sccache --version
    cache: true
    filter:
      - .rwx/ci.yml

  # Shared Boost repository clone (cached, reused across all B2 builds)
  # This eliminates redundant 50+ MB downloads per build task
  - key: setup-boost-tree
    use: [clone-capy]
    run: |
      sudo apt-get update && sudo apt-get install -y python3 python-is-python3 git

      # Clone Boost once with minimal depth and blob filtering
      git clone --depth 1 --filter=blob:none --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 --filter=blob:none tools/build tools/boostdep tools/boost_install

      # Integrate capy into Boost tree
      cp -r ../capy-root libs/capy

      # Create root Jamfile for B2 project structure
      echo "use-project /boost/capy : build ;" > libs/capy/Jamfile
      echo "build-project build ;" >> libs/capy/Jamfile
      echo "build-project test ;" >> libs/capy/Jamfile

      # Run dependency installer once
      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy

      # Bootstrap B2 build system
      ./bootstrap.sh gcc

      echo "✓ Boost tree setup complete"
    cache: true
    filter:
      - capy-root/**
      - .rwx/ci.yml

  # ============================================================================
  # Windows and macOS Builds
  # ============================================================================
  # NOTE: Windows and macOS builds require platform-specific runner configuration
  # in RWX. These can be handled via:
  # 1. Hybrid approach: Keep these builds in GitHub Actions while using RWX for Linux
  # 2. RWX platform-specific agents: Configure self-hosted Windows/macOS agents
  # 3. Cloud providers: Use AWS EC2 Mac instances or Windows VMs with RWX agents
  #
  # For initial migration, focus on Linux builds (8/12 configurations) which
  # demonstrate RWX's intelligent caching. Windows/macOS can be added later.
  #
  # Original matrix includes:
  # - MSVC 14.42 (windows-2022)
  # - MSVC 14.34 shared (windows-2022)
  # - MinGW (windows-2022)
  # - Apple Clang with asan+ubsan (macos-latest)
  # ============================================================================

  # ============================================================================
  # Linux GCC Builds (2 configurations: GCC 12, GCC 13)
  # ============================================================================
  #
  # NOTE: GCC 15 builds (3 configurations) are NOT included in RWX CI because
  # GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base.
  # These builds remain in GitHub Actions workflow (.github/workflows/ci.yml)
  # which uses container: "ubuntu:25.04" for GCC 15 configurations.
  #
  # Hybrid CI Strategy:
  # - RWX CI: GCC 12, 13; Clang 17, 20 (Ubuntu 24.04 compatible)
  # - GitHub Actions: GCC 15 (requires Ubuntu 25.04), Windows, macOS
  # ============================================================================

  # - key: install-gcc-15
  #   run: |
  #     sudo apt-get update
  #     sudo apt-get install -y software-properties-common
  #     sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
  #     sudo apt-get update
  #     sudo apt-get install -y gcc-15 g++-15 build-essential git cmake

  # GCC 15: Both B2 and CMake builds (matches build-cmake: true in GitHub Actions)
  # DISABLED: GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base
  # - key: build-gcc-15-b2
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     # Setup Boost tree with capy integrated
  #     sudo apt-get install -y python3 python-is-python3
  #     git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
  #     cd boost-source
  #     git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
  #     cp -r ../capy-root libs/capy
  #     python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
  #     ./bootstrap.sh gcc
  #     cd ..
  #
  #     # Run B2 build
  #     cd boost-source
  #     ./b2 \
  #       toolset=gcc-15 \
  #       cxxstd=20 \
  #       variant=release \
  #       address-model=64 \
  #       link=shared \
  #       libs/capy/test
  #   filter:
  #     - capy-root/**

  # - key: build-gcc-15-cmake
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     cd capy-root
  #     cmake -B __build__ \
  #       -DCMAKE_BUILD_TYPE=Release \
  #       -DCMAKE_CXX_STANDARD=20 \
  #       -DCMAKE_CXX_COMPILER=g++-15 \
  #       -DCMAKE_C_COMPILER=gcc-15
  #     cmake --build __build__ --target boost_capy_tests
  #     ctest --test-dir __build__
  #   filter:
  #     - capy-root/**

  # GCC 15 asan+ubsan: B2 build only (no build-cmake flag in GitHub Actions)
  # DISABLED: GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base
  # - key: build-gcc-15-asan-ubsan
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     # Setup Boost tree with capy integrated
  #     sudo apt-get install -y python3 python-is-python3
  #     git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
  #     cd boost-source
  #     git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
  #     cp -r ../capy-root libs/capy
  #     python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
  #     ./bootstrap.sh gcc
  #     cd ..
  #
  #     # Disable ASLR for sanitizers
  #     sudo sysctl vm.mmap_rnd_bits=28 || true
  #
  #     # Run B2 build
  #     cd boost-source
  #     ./b2 \
  #       toolset=gcc-15 \
  #       cxxstd=20 \
  #       variant=debug \
  #       address-model=64 \
  #       link=shared \
  #       cxxflags="-fsanitize=address -fsanitize=undefined -fsanitize-address-use-after-scope -fsanitize=pointer-subtract" \
  #       linkflags="-fsanitize=address -fsanitize=undefined" \
  #       libs/capy/test
  #   filter:
  #     - capy-root/**
  #   env:
  #     ASAN_OPTIONS: detect_invalid_pointer_pairs=2:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
  - key: install-gcc-12
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-12 g++-12 build-essential git cmake

  # GCC 12: B2 build only (matches original workflow)
  - key: build-gcc-12
    use: [clone-capy, install-sccache, install-gcc-12]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-gcc-12 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-gcc12-b2"
      sccache --show-stats

      # Setup Boost tree with capy integrated
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with shallow clone
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy

      # Dependency install
      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy

      # Create sccache wrapper scripts for gcc-12 BEFORE bootstrap
      # This is critical: B2 records compiler paths during configuration
      mkdir -p ~/bin
      cat > ~/bin/g++-12 << 'EOF'
      #!/bin/bash
      exec sccache /usr/bin/g++-12 "$@"
      EOF
      cat > ~/bin/gcc-12 << 'EOF'
      #!/bin/bash
      exec sccache /usr/bin/gcc-12 "$@"
      EOF
      chmod +x ~/bin/g++-12 ~/bin/gcc-12
      export PATH=~/bin:$PATH

      # Bootstrap B2
      ./bootstrap.sh gcc

      BUILD_START=$(date +%s)

      # ===== INCREMENTAL BUILD CACHING =====
      # Restore previous build artifacts AFTER Boost tree setup (enables incremental builds)
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-gcc12"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"
      if [ -d "$ARTIFACTS_DIR/bin.v2" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/bin.v2" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Run B2 build (using sccache wrappers, artifacts enable incremental builds)
      ./b2 \
        toolset=gcc-12 \
        cxxstd=20 \
        variant=release \
        address-model=64 \
        link=shared \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "bin.v2" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r bin.v2 "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # ===== SCCACHE STATISTICS =====
      echo ""
      echo "╔═══════════════════════════════════════════════════════════════╗"
      echo "║                   SCCACHE STATISTICS                           ║"
      echo "╚═══════════════════════════════════════════════════════════════╝"
      sccache --show-stats

      # Save sccache stats to dedicated file for easy access
      mkdir -p /tmp/cache-stats
      sccache --show-stats > /tmp/cache-stats/build-gcc-12.txt 2>&1

      # Extract key metrics
      CACHE_HITS=$(sccache --show-stats | grep -i "cache hits" | head -1 || echo "N/A")
      CACHE_MISSES=$(sccache --show-stats | grep -i "cache misses" | head -1 || echo "N/A")
      CACHE_RATE=$(sccache --show-stats | grep -i "cache hit rate" | head -1 || echo "N/A")

      echo ""
      echo "📊 KEY METRICS:"
      echo "  ${CACHE_HITS}"
      echo "  ${CACHE_MISSES}"
      echo "  ${CACHE_RATE}"
      echo ""

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-gcc-12 completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing and cache stats for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-gcc-12|SUCCESS" >> /tmp/timing-logs/tasks.log
      echo "build-gcc-12|${CACHE_HITS}|${CACHE_MISSES}|${CACHE_RATE}" >> /tmp/cache-stats/summary.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-gcc12-b2/**
      - tmp/build-artifacts-gcc12/**

  - key: install-gcc-13-coverage
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-13 g++-13 build-essential git cmake lcov wget unzip

  # GCC 13 coverage: CMake build only (coverage flag disables B2 in GitHub Actions)
  - key: build-gcc-13-coverage
    use: [clone-capy, install-sccache, install-gcc-13-coverage]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-gcc-13-coverage STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-gcc13-coverage"
      export CC="sccache gcc-13"
      export CXX="sccache g++-13"
      sccache --show-stats

      # ===== INCREMENTAL BUILD CACHING =====
      # Use workspace-relative artifacts to enable CMake incremental compilation
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-gcc13-coverage"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"

      cd capy-root
      # Restore previous build artifacts if they exist
      if [ -d "$ARTIFACTS_DIR/__build__" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/__build__" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Build with sccache (caches object files)
      BUILD_START=$(date +%s)
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_CXX_STANDARD=20 \
        -DCMAKE_CXX_COMPILER=g++-13 \
        -DCMAKE_C_COMPILER=gcc-13 \
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
        -DCMAKE_C_COMPILER_LAUNCHER=sccache \
        -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
        -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__
      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "__build__" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r __build__ "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # Generate coverage report
      lcov -c -q -o "__build__/coverage.info" -d "__build__" \
        --include "$(pwd)/*" --gcov-tool gcov-13

      # Upload to codecov
      bash <(curl -s https://codecov.io/bash) -f "__build__/coverage.info"

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-gcc-13-coverage completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-gcc-13-coverage|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-gcc13-coverage/**
      - tmp/build-artifacts-gcc13-coverage/**

  # ============================================================================
  # Linux Clang Builds (5 configurations: Clang 17, Clang 20 variants, Clang 20 x86)
  # ============================================================================
  - key: install-clang-20
    run: |
      sudo apt-get update
      sudo apt-get install -y wget gnupg software-properties-common
      wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
      sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
      sudo apt-get update
      sudo apt-get install -y clang-20 build-essential git cmake

  # Clang 20: Both B2 and CMake builds (matches build-cmake: true in GitHub Actions)
  # Split into C++20 and C++23 builds to keep each task <2min
  - key: build-clang-20-b2-cxx20
    use: [clone-capy, install-sccache, install-clang-20]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-b2-cxx20 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-b2-cxx20"
      sccache --show-stats

      # Setup Boost tree with capy integrated
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with shallow clone
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy
      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      BUILD_START=$(date +%s)

      # ===== INCREMENTAL BUILD CACHING =====
      # Restore previous build artifacts AFTER Boost tree setup (enables incremental builds)
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-clang20-b2-cxx20"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"
      if [ -d "$ARTIFACTS_DIR/bin.v2" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/bin.v2" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Run B2 build for C++20 only (sccache caches object files, artifacts enable incremental builds)
      ./b2 \
        toolset=clang-20 \
        cxxstd=20 \
        variant=release \
        address-model=64 \
        link=shared \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "bin.v2" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r bin.v2 "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-clang-20-b2-cxx20 completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-clang-20-b2-cxx20|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-clang20-b2-cxx20/**
      - tmp/build-artifacts-clang20-b2-cxx20/**

  - key: build-clang-20-b2-cxx23
    use: [clone-capy, install-sccache, install-clang-20]
    env:
      SCCACHE_CACHE_SIZE: 1G
    run: |
      # ===== TIMING START =====
      TASK_START=$(date +%s)
      echo "▶ TASK: build-clang-20-b2-cxx23 STARTED at $(date -Iseconds)"

      # Configure sccache with workspace-relative path
      WORKSPACE_ROOT=$(pwd)
      export SCCACHE_DIR="$WORKSPACE_ROOT/tmp/sccache-clang20-b2-cxx23"
      sccache --show-stats

      # Setup Boost tree with capy integrated
      sudo apt-get install -y python3 python-is-python3

      # Clone Boost with shallow clone
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
      cp -r ../capy-root libs/capy
      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      BUILD_START=$(date +%s)

      # ===== INCREMENTAL BUILD CACHING =====
      # Restore previous build artifacts AFTER Boost tree setup (enables incremental builds)
      ARTIFACTS_DIR="$WORKSPACE_ROOT/tmp/build-artifacts-clang20-b2-cxx23"
      echo "📦 Artifacts location: $ARTIFACTS_DIR"
      if [ -d "$ARTIFACTS_DIR/bin.v2" ]; then
        echo "✓ Restoring previous build artifacts for incremental compilation..."
        cp -r "$ARTIFACTS_DIR/bin.v2" . 2>/dev/null || true
      else
        echo "✗ No previous artifacts - full build"
      fi

      # Run B2 build for C++23 only (sccache caches object files, artifacts enable incremental builds)
      ./b2 \
        toolset=clang-20 \
        cxxstd=23 \
        variant=release \
        address-model=64 \
        link=shared \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Save build artifacts for next run (enables incremental builds)
      if [ -d "bin.v2" ]; then
        echo "💾 Saving build artifacts for incremental builds..."
        mkdir -p "$ARTIFACTS_DIR"
        cp -r bin.v2 "$ARTIFACTS_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
