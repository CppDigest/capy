#
# RWX CI Configuration for Boost.Capy
# Migrated from GitHub Actions workflow
#
# This configuration uses RWX's DAG-based execution with content-based caching
# to optimize the build matrix for faster CI turnaround.
#
# PREREQUISITES:
# 1. RWX account setup with organization created
# 2. GitHub App created in RWX Vault named 'CppDigest' with app slug 'cppdigest-test'
#    - Vault name: CppDigest
#    - GitHub App slug: cppdigest-test
#    - Required permissions: Contents (Read & Write), Pull Requests (Read & Write)
# 3. GitHub App installed on CppDigest/capy repository
#
# CURRENT STATUS:
# - Linux builds (8 configurations): GCC 12/13/15, Clang 17/20 with variants
# - Windows/macOS builds (4 configurations): Require platform-specific runner setup
#
# USAGE:
# - Test locally: rwx run .rwx/ci.yml --init commit-sha=HEAD
# - Auto-triggers on push/PR once committed to default branch
#

on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}

# Base configuration applied to all tasks
base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ============================================================================
  # Base Setup Tasks (shared dependencies)
  # ============================================================================

  - key: clone-capy
    run: |
      git clone --depth 1 https://github.com/timon0305/capy.git capy-root
      cd capy-root
      git fetch origin ${{ init.commit-sha }}
      git checkout ${{ init.commit-sha }}
    filter:
      - .github/workflows/**
      - include/**
      - src/**
      - test/**
      - CMakeLists.txt
      - Jamfile

  # ============================================================================
  # Windows and macOS Builds
  # ============================================================================
  # NOTE: Windows and macOS builds require platform-specific runner configuration
  # in RWX. These can be handled via:
  # 1. Hybrid approach: Keep these builds in GitHub Actions while using RWX for Linux
  # 2. RWX platform-specific agents: Configure self-hosted Windows/macOS agents
  # 3. Cloud providers: Use AWS EC2 Mac instances or Windows VMs with RWX agents
  #
  # For initial migration, focus on Linux builds (8/12 configurations) which
  # demonstrate RWX's intelligent caching. Windows/macOS can be added later.
  #
  # Original matrix includes:
  # - MSVC 14.42 (windows-2022)
  # - MSVC 14.34 shared (windows-2022)
  # - MinGW (windows-2022)
  # - Apple Clang with asan+ubsan (macos-latest)
  # ============================================================================

  # ============================================================================
  # Linux GCC Builds (4 configurations)
  # ============================================================================

  - key: install-gcc-15
    run: |
      sudo apt-get update
      sudo apt-get install -y software-properties-common
      sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
      sudo apt-get update
      sudo apt-get install -y gcc-14 g++-14 build-essential git cmake

  - key: build-gcc-15
    use: [clone-capy, install-gcc-15]
    run: |
      # Check and show current working directory
      echo "Current directory: $(pwd)"
      echo "Files in current directory:"
      ls -la

      # Clone Boost directly here since 'use' isn't merging properly
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      echo "Creating libs/capy directory..."
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with B2
      cd boost-source-dev
      CXX=g++-14 CC=gcc-14 ./bootstrap.sh gcc

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=gcc \
        variant=debug,release \
        cxxstd=20 \
        address-model=64 \
        link=shared

      # Build with CMake
      cd ../capy-root
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_CXX_STANDARD=20 \
        -DCMAKE_CXX_COMPILER=g++-14 \
        -DCMAKE_C_COMPILER=gcc-14
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  - key: build-gcc-15-asan-ubsan
    use: [clone-capy, install-gcc-15]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Disable ASLR for sanitizers
      sudo sysctl vm.mmap_rnd_bits=28 || true

      # Build with B2 (with sanitizers)
      cd boost-source-dev
      CXX=g++-14 CC=gcc-14 ./bootstrap.sh gcc

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=gcc \
        variant=debug \
        cxxstd=20 \
        address-model=64 \
        link=shared \
        cxxflags="-fsanitize=address -fsanitize=undefined -fsanitize-address-use-after-scope -fsanitize=pointer-subtract" \
        linkflags="-fsanitize=address -fsanitize=undefined"
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**
    env:
      ASAN_OPTIONS: detect_invalid_pointer_pairs=2:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1

  - key: install-gcc-12
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-12 g++-12 build-essential git cmake

  - key: build-gcc-12
    use: [clone-capy, install-gcc-12]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with B2
      cd boost-source-dev
      CXX=g++-12 CC=gcc-12 ./bootstrap.sh gcc

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=gcc \
        variant=debug,release \
        cxxstd=20 \
        address-model=64 \
        link=shared
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  - key: install-gcc-13-coverage
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-13 g++-13 build-essential git cmake lcov wget unzip

  - key: build-gcc-13-coverage
    use: [clone-capy, install-gcc-13-coverage]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with CMake (coverage enabled)
      cd capy-root
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_CXX_STANDARD=20 \
        -DCMAKE_CXX_COMPILER=g++-13 \
        -DCMAKE_C_COMPILER=gcc-13 \
        -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
        -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__

      # Generate coverage report
      lcov -c -q -o "__build__/coverage.info" -d "__build__" \
        --include "$(pwd)/*" --gcov-tool gcov-13

      # Upload to codecov
      bash <(curl -s https://codecov.io/bash) -f "__build__/coverage.info"
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  # ============================================================================
  # Linux Clang Builds (4 configurations)
  # ============================================================================

  - key: install-clang-20
    run: |
      sudo apt-get update
      sudo apt-get install -y wget gnupg software-properties-common
      wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
      sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
      sudo apt-get update
      sudo apt-get install -y clang-20 build-essential git cmake

  - key: build-clang-20
    use: [clone-capy, install-clang-20]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with B2 (multiple C++ standards)
      cd boost-source-dev
      CXX=clang++-20 CC=clang-20 ./bootstrap.sh clang

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=clang \
        variant=debug,release \
        cxxstd=20,23 \
        address-model=64 \
        link=shared

      # Build with CMake
      cd ../capy-root
      cmake -B __build__ \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_CXX_STANDARD=23 \
        -DCMAKE_CXX_COMPILER=clang++-20 \
        -DCMAKE_C_COMPILER=clang-20
      cmake --build __build__ --target boost_capy_tests
      ctest --test-dir __build__
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  - key: build-clang-20-asan-ubsan
    use: [clone-capy, install-clang-20]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Disable ASLR for sanitizers
      sudo sysctl vm.mmap_rnd_bits=28 || true

      # Build with B2 (with sanitizers)
      cd boost-source-dev
      CXX=clang++-20 CC=clang-20 ./bootstrap.sh clang

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=clang \
        variant=debug \
        cxxstd=20 \
        address-model=64 \
        link=static \
        cxxflags="-fsanitize=address -fsanitize=undefined -fsanitize-address-use-after-scope -fsanitize=pointer-subtract" \
        linkflags="-fsanitize=address -fsanitize=undefined"
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**
    env:
      ASAN_OPTIONS: detect_invalid_pointer_pairs=0:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1

  - key: install-clang-17
    run: |
      sudo apt-get update
      sudo apt-get install -y clang-17 build-essential git cmake

  - key: build-clang-17
    use: [clone-capy, install-clang-17]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with B2
      cd boost-source-dev
      CXX=clang++-17 CC=clang-17 ./bootstrap.sh clang

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=clang \
        variant=debug,release \
        cxxstd=20 \
        address-model=64 \
        link=static
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  - key: install-clang-20-multilib
    run: |
      sudo apt-get update
      sudo apt-get install -y wget gnupg software-properties-common
      wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
      sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
      sudo apt-get update
      sudo apt-get install -y clang-20 build-essential git cmake gcc-multilib g++-multilib

  - key: build-clang-20-x86
    use: [clone-capy, install-clang-20-multilib]
    run: |
      # Clone Boost directly here
      echo "Cloning Boost develop..."
      git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source-dev
      echo "Boost cloned, initializing required submodules..."
      cd boost-source-dev
      git submodule update --init --depth 1 \
        tools/build \
        tools/boostdep \
        tools/boost_install \
        libs/config \
        libs/assert \
        libs/throw_exception \
        libs/core \
        libs/static_assert
      cd ..

      # Ensure libs directory exists and patch Boost
      mkdir -p boost-source-dev/libs
      cp -r capy-root boost-source-dev/libs/capy

      # Build with B2 (32-bit)
      cd boost-source-dev
      CXX=clang++-20 CC=clang-20 ./bootstrap.sh clang

      # Generate Boost headers first (required by capy)
      ./b2 headers

      ./b2 \
        --with-capy \
        toolset=clang \
        variant=debug,release \
        cxxstd=20,23 \
        address-model=32 \
        link=static
    filter:
      - capy-root/**
      - boost-source-dev/libs/capy/**

  # ============================================================================
  # Changelog Task (independent)
  # ============================================================================

  - key: changelog
    use: [clone-capy]
    run: |
      cd capy-root

      # Generate changelog summary
      echo "# Changelog Summary"
      echo ""
      echo "## Recent Commits (Last 20)"
      echo ""
      git log --pretty=format:"- %h - %s (%an, %ar)" -n 20
      echo ""
      echo ""
      echo "## Contributors"
      echo ""
      git log --pretty=format:"%an" -n 100 | sort -u
      echo ""
      echo ""
      echo "## Commit Activity by Author"
      echo ""
      git shortlog -sn --no-merges | head -20
    filter:
      - capy-root/**
