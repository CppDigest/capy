  # This task serves as the final aggregation point for timing analysis.
  # Since RWX tasks run in isolated workspaces, timing data must be extracted
  # from individual task logs by the automation script.
  #
  # This task ensures all build tasks complete successfully and provides
  # a clear marker for automation to know when to extract timing data.
  # NOTE: Task key must remain 'summary' for automation script compatibility
  # ============================================================================
  - key: summary
    use: [build-gcc-12, build-gcc-13-coverage, build-clang-20-b2-cxx20, build-clang-20-b2-cxx23, build-clang-20-cmake, build-clang-20-asan-ubsan, build-clang-17, build-clang-20-x86-cxx20, build-clang-20-x86-cxx23, changelog]
    cache: false
    run: |
      # Force execution by including timestamp (prevents cache hits)
      echo "⏰ Run timestamp: $(date -Iseconds) (ensures fresh execution)"

      SUMMARY_START=$(date +%s)

      echo "════════════════════════════════════════════════════════════════"
      echo "RWX CI BUILD SUMMARY"
      echo "════════════════════════════════════════════════════════════════"
      echo ""
      echo "✅ All build tasks completed successfully"
      echo ""
      echo "📊 Build Task Status:"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  build-gcc-12                   ✅ Complete"
      echo "  build-gcc-13-coverage          ✅ Complete"
      echo "  build-clang-20-b2-cxx20        ✅ Complete"
      echo "  build-clang-20-b2-cxx23        ✅ Complete"
      echo "  build-clang-20-cmake           ✅ Complete"
      echo "  build-clang-20-asan-ubsan      ✅ Complete"
      echo "  build-clang-17                 ✅ Complete"
      echo "  build-clang-20-x86-cxx20       ✅ Complete"
      echo "  build-clang-20-x86-cxx23       ✅ Complete"
      echo "  changelog                      ✅ Complete"
      echo ""
      echo "📈 Timing Analysis:"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  NOTE: Due to RWX task isolation, timing data cannot be aggregated"
      echo "  across tasks. Each task outputs timing with ⏱ TASK: marker."
      echo ""
      echo "  To extract timing from individual task logs, use RWX CLI:"
      echo "    rwx logs <run-id>:<task-key> --output-dir ./logs"
      echo "    grep '⏱ TASK:' ./logs/*.txt"
      echo ""
      echo "  Example task keys for this run:"
      echo "    • build-gcc-12"
      echo "    • build-gcc-13-coverage"
      echo "    • build-clang-20-b2-cxx20"
      echo "    • build-clang-20-b2-cxx23"
      echo "    • build-clang-20-cmake"
      echo "    • build-clang-20-asan-ubsan"
      echo "    • build-clang-17"
      echo "    • build-clang-20-x86-cxx20"
      echo "    • build-clang-20-x86-cxx23"
      echo ""
      echo "💡 Optimization Targets:"
      echo "  • Target: <60s per task for incremental builds"
      echo "  • Check sccache hit rates in task logs"
      echo "  • Verify incremental build artifact restoration"
      echo ""

      SUMMARY_END=$(date +%s)
      SUMMARY_DURATION=$((SUMMARY_END - SUMMARY_START))

      echo "⏱ TASK: summary completed in ${SUMMARY_DURATION}s"
      echo "🎯 LONGEST TASK: Extract from individual build task logs using RWX CLI"
      echo ""
