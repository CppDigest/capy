      cp -r ../capy-root libs/capy

      # Create root Jamfile for B2 to find the project structure
      echo "use-project /boost/capy : build ;" > libs/capy/Jamfile
      echo "build-project build ;" >> libs/capy/Jamfile
      echo "build-project test ;" >> libs/capy/Jamfile

      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
      ./bootstrap.sh gcc

      # Run B2 build for C++23 only (32-bit x86, sccache caches object files)
      BUILD_START=$(date +%s)
      ./b2 \
        toolset=clang-20 \
        cxxstd=23 \
        variant=release \
        address-model=32 \
        link=static \
        libs/capy/test

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      # Cache build artifacts if not from cache
      if [ "$CACHE_HIT" = false ] && [ -d "bin.v2" ]; then
        echo "💾 Caching build artifacts..."
        mkdir -p "$CACHE_DIR"
        cp -r bin.v2 "$CACHE_DIR/" 2>/dev/null || true
      fi

      # Show sccache statistics
      sccache --show-stats

      # ===== TIMING END =====
      TASK_END=$(date +%s)
      TASK_DURATION=$((TASK_END - TASK_START))
      echo "⏱ TASK: build-clang-20-x86-cxx23 completed in ${TASK_DURATION}s (build: ${BUILD_TIME}s)"

      # Log timing for summary
      mkdir -p /tmp/timing-logs
      echo "${TASK_DURATION}|build-clang-20-x86-cxx23|SUCCESS" >> /tmp/timing-logs/tasks.log
    cache: true
    filter:
      - capy-root/**/*.cpp
      - capy-root/**/*.hpp
      - capy-root/**/*.h
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile
      - tmp/sccache-clang20-x86-cxx23/**

  # ============================================================================
  # Changelog Task (independent)
  # ============================================================================

  - key: changelog
    use: [clone-capy]
    run: |
      cd capy-root

      # Generate changelog summary
      echo "# Changelog Summary"
      echo ""
      echo "## Recent Commits (Last 20)"
      echo ""
      git log --pretty=format:"- %h - %s (%an, %ar)" -n 20
      echo ""
      echo ""
      echo "## Contributors"
      echo ""
      git log --pretty=format:"%an" -n 100 | sort -u
      echo ""
      echo ""
      echo "## Commit Activity by Author"
      echo ""
      git shortlog -sn --no-merges | head -20
    filter:
      - capy-root/**

  # ============================================================================
  # Build Performance Analysis & Optimization Summary
  # ============================================================================
  - key: performance-analysis
    use: [build-gcc-12, build-gcc-13-coverage, build-clang-20-b2-cxx20, build-clang-20-b2-cxx23, build-clang-20-cmake, build-clang-20-asan-ubsan, build-clang-17, build-clang-20-x86-cxx20, build-clang-20-x86-cxx23]
    run: |
      echo ""
      echo "╔════════════════════════════════════════════════════════════════╗"
      echo "║          RWX CI BUILD PERFORMANCE ANALYSIS                     ║"
      echo "╚════════════════════════════════════════════════════════════════╝"
      echo ""

      if [ -f /tmp/timing-logs/tasks.log ]; then
        echo "📊 Build Task Timings (sorted by duration):"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        sort -rn /tmp/timing-logs/tasks.log | while IFS='|' read -r duration task status; do
          printf "  %-30s %8s  [%s]\n" "$task" "$duration" "$status"
        done
        echo ""

        LONGEST=$(sort -rn /tmp/timing-logs/tasks.log | head -1)
        LONGEST_TASK=$(echo "$LONGEST" | cut -d'|' -f2)
        LONGEST_TIME=$(echo "$LONGEST" | cut -d'|' -f1)

        echo "🎯 LONGEST TASK: $LONGEST_TASK ($LONGEST_TIME)"
        echo ""
        echo "📈 Optimization Recommendations:"
        if [ "$LONGEST_TIME" -gt 120 ]; then
          echo "  ⚠️  Target not met (>2min). Optimize: $LONGEST_TASK"
          echo "  • Consider distributed sccache (S3/GCS)"
          echo "  • Increase cache size"
          echo "  • Profile depinst.py execution"
        else
          echo "  ✅ Target achieved (<2min)!"
        fi
      else
        echo "⚠️  No timing data available"
      fi

      echo ""
      echo "╔════════════════════════════════════════════════════════════════╗"
      echo "║          NEXT ITERATION STEPS                                  ║"
      echo "╚════════════════════════════════════════════════════════════════╝"
      echo ""
      echo "1. Identify longest task above"
      echo "2. Analyze task logs for bottlenecks"
      echo "3. Apply targeted optimizations:"
      echo "   - Enable distributed sccache (SCCACHE_BUCKET env)"
      echo "   - Optimize Boost setup (if applicable)"
      echo "   - Increase compiler cache size"
      echo "4. Re-run and measure improvement"
      echo "5. Repeat until all tasks <2min"
      echo ""
    filter:
      - .rwx/ci.yml

