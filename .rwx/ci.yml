      git log --pretty=format:"- %h - %s (%an, %ar)" -n 20
      echo ""
      echo ""
      echo "## Contributors"
      echo ""
      git log --pretty=format:"%an" -n 100 | sort -u
      echo ""
      echo ""
      echo "## Commit Activity by Author"
      echo ""
      git shortlog -sn --no-merges | head -20
    filter:
      - capy-root/**

  # ============================================================================
  # Build Performance Analysis & Optimization Summary
  # ============================================================================
  - key: performance-analysis
    use: [build-gcc-12, build-gcc-13-coverage, build-clang-20-b2-cxx20, build-clang-20-b2-cxx23, build-clang-20-cmake, build-clang-20-asan-ubsan, build-clang-17, build-clang-20-x86-cxx20, build-clang-20-x86-cxx23]
    run: |
      echo ""
      echo "╔════════════════════════════════════════════════════════════════╗"
      echo "║          RWX CI BUILD PERFORMANCE ANALYSIS                     ║"
      echo "╚════════════════════════════════════════════════════════════════╝"
      echo ""

      # Check if timing data exists and aggregate it
      if [ -f /tmp/timing-logs/tasks.log ]; then
        echo "📊 Build Task Timings (sorted by duration):"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        sort -rn -t'|' -k1 /tmp/timing-logs/tasks.log | while IFS='|' read -r duration task status; do
          printf "  %-35s %8ss  [%s]\n" "$task" "$duration" "$status"
        done

        # Extract and highlight the longest (bottleneck) task
        LONGEST_LINE=$(sort -rn -t'|' -k1 /tmp/timing-logs/tasks.log | head -1)
        LONGEST_DURATION=$(echo "$LONGEST_LINE" | cut -d'|' -f1)
        LONGEST_TASK=$(echo "$LONGEST_LINE" | cut -d'|' -f2)

        echo ""
        echo "🎯 LONGEST TASK: ${LONGEST_TASK} = ${LONGEST_DURATION}s"
        echo ""

        # Show cache statistics if available
        if [ -f /tmp/cache-stats/summary.log ]; then
          echo "📦 Cache Statistics Summary:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat /tmp/cache-stats/summary.log
          echo ""
        fi
      else
        echo "⚠️  No timing data available at /tmp/timing-logs/tasks.log"
        echo ""
        echo "📊 Build Tasks Status:"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Task                           Status"
        echo "  ─────────────────────────────  ──────"
        echo "  build-gcc-12                   ✅ Complete"
        echo "  build-gcc-13-coverage          ✅ Complete"
        echo "  build-clang-20-b2-cxx20        ✅ Complete"
        echo "  build-clang-20-b2-cxx23        ✅ Complete"
        echo "  build-clang-20-cmake           ✅ Complete"
        echo "  build-clang-20-asan-ubsan      ✅ Complete"
        echo "  build-clang-17                 ✅ Complete"
        echo "  build-clang-20-x86-cxx20       ✅ Complete"
        echo "  build-clang-20-x86-cxx23       ✅ Complete"
        echo ""
      fi

      echo "💡 Optimization Targets (<60s per task):"
