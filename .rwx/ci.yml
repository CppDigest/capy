#
# RWX CI Configuration for Boost.Capy
# Migrated from GitHub Actions workflow
#
# This configuration uses RWX's DAG-based execution with content-based caching
# to optimize the build matrix for faster CI turnaround.
#
# PREREQUISITES:
# 1. RWX account setup with organization created
# 2. GitHub App created in RWX Vault named 'CppDigest' with app slug 'cppdigest-test'
#    - Vault name: CppDigest
#    - GitHub App slug: cppdigest-test
#    - Required permissions: Contents (Read & Write), Pull Requests (Read & Write)
# 3. GitHub App installed on CppDigest/capy repository
#
# CURRENT STATUS:
# - Linux builds (5 configurations): GCC 12/13, Clang 17/20 with variants
#   - GCC 12 (B2), GCC 13 coverage (CMake), Clang 17 (B2), Clang 20 (B2+CMake), Clang 20 x86 (B2)
#   - Target time: 5-10 minutes with RWX caching for B2 builds
# - GCC 15 builds (3 configurations): Remain in GitHub Actions (require Ubuntu 25.04)
# - Windows/macOS builds (4 configurations): Require platform-specific runner setup
#
# HYBRID CI APPROACH:
# - RWX CI: Handles Ubuntu 24.04-compatible builds (5 Linux configurations)
# - GitHub Actions: Handles GCC 15 (Ubuntu 25.04), Windows, macOS builds
#
# USAGE:
# - Test locally: rwx run .rwx/ci.yml --init commit-sha=HEAD
# - Auto-triggers on push/PR once committed to default branch
#

on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        clone-url: ${{ event.github.push.repository.clone_url }}
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        clone-url: ${{ event.github.pull_request.head.repo.clone_url }}

# Base configuration applied to all tasks
base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ============================================================================
  # Base Setup Tasks (shared dependencies)
  # ============================================================================

  - key: clone-capy
    run: |
      git clone --depth 1 ${{ init.clone-url }} capy-root
      cd capy-root
      git fetch origin ${{ init.commit-sha }}
      git checkout ${{ init.commit-sha }}
    filter:
      - capy-root/.github/workflows/**
      - capy-root/include/**
      - capy-root/src/**
      - capy-root/test/**
      - capy-root/bench/**
      - capy-root/extra/**
      - capy-root/CMakeLists.txt
      - capy-root/test/CMakeLists.txt
      - capy-root/bench/CMakeLists.txt
      - capy-root/test/cmake_test/CMakeLists.txt
      - capy-root/test/unit/CMakeLists.txt
      - capy-root/extra/test_suite/CMakeLists.txt
      - capy-root/extra/test_suite/DiscoverTests.cmake
      - capy-root/extra/test_suite/DiscoverAndWriteTestsScripts.cmake
      - capy-root/build/Jamfile
      - capy-root/test/Jamfile
      - capy-root/test/unit/Jamfile

  # Shared Boost tree setup with capy integrated (cached across all B2 builds)
  # This task clones Boost, integrates capy, runs depinst, and caches everything.
  # This eliminates 10-60s of depinst overhead from each individual build.
  - key: setup-boost-tree
    use: [clone-capy]
    run: |
      sudo apt-get update
      sudo apt-get install -y python3 python-is-python3 git

      # Clone Boost with partial clone to reduce download size
      git clone --depth 1 --filter=blob:none --branch develop https://github.com/boostorg/boost.git boost-source
      cd boost-source
      git submodule update --init --depth 1 --filter=blob:none tools/build tools/boostdep tools/boost_install
      ./bootstrap.sh gcc

      # Integrate capy into Boost tree and install dependencies (cached!)
      cp -r ../capy-root libs/capy

      # Create root Jamfile for B2 to find the project structure
      echo "use-project /boost/capy : build ;" > libs/capy/Jamfile
      echo "build-project build ;" >> libs/capy/Jamfile
      echo "build-project test ;" >> libs/capy/Jamfile

      python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
    cache: true
    filter:
      - .rwx/ci.yml
      - capy-root/**

  # Shared sccache installation (distributed compiler cache)
  # sccache supports local disk cache (default) or cloud backends (S3, GCS, Redis)
  # For distributed caching, set: SCCACHE_BUCKET, SCCACHE_REGION, AWS credentials
  - key: install-sccache
    run: |
      wget https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz
      tar xzf sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz
      sudo mv sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/
      chmod +x /usr/local/bin/sccache
      sccache --version
    cache: true
    filter:
      - .rwx/ci.yml

  # ============================================================================
  # Windows and macOS Builds
  # ============================================================================
  # NOTE: Windows and macOS builds require platform-specific runner configuration
  # in RWX. These can be handled via:
  # 1. Hybrid approach: Keep these builds in GitHub Actions while using RWX for Linux
  # 2. RWX platform-specific agents: Configure self-hosted Windows/macOS agents
  # 3. Cloud providers: Use AWS EC2 Mac instances or Windows VMs with RWX agents
  #
  # For initial migration, focus on Linux builds (8/12 configurations) which
  # demonstrate RWX's intelligent caching. Windows/macOS can be added later.
  #
  # Original matrix includes:
  # - MSVC 14.42 (windows-2022)
  # - MSVC 14.34 shared (windows-2022)
  # - MinGW (windows-2022)
  # - Apple Clang with asan+ubsan (macos-latest)
  # ============================================================================

  # ============================================================================
  # Linux GCC Builds (2 configurations: GCC 12, GCC 13)
  # ============================================================================
  #
  # NOTE: GCC 15 builds (3 configurations) are NOT included in RWX CI because
  # GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base.
  # These builds remain in GitHub Actions workflow (.github/workflows/ci.yml)
  # which uses container: "ubuntu:25.04" for GCC 15 configurations.
  #
  # Hybrid CI Strategy:
  # - RWX CI: GCC 12, 13; Clang 17, 20 (Ubuntu 24.04 compatible)
  # - GitHub Actions: GCC 15 (requires Ubuntu 25.04), Windows, macOS
  # ============================================================================

  # - key: install-gcc-15
  #   run: |
  #     sudo apt-get update
  #     sudo apt-get install -y software-properties-common
  #     sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
  #     sudo apt-get update
  #     sudo apt-get install -y gcc-15 g++-15 build-essential git cmake

  # GCC 15: Both B2 and CMake builds (matches build-cmake: true in GitHub Actions)
  # DISABLED: GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base
  # - key: build-gcc-15-b2
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     # Setup Boost tree with capy integrated
  #     sudo apt-get install -y python3 python-is-python3
  #     git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
  #     cd boost-source
  #     git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
  #     cp -r ../capy-root libs/capy
  #     python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
  #     ./bootstrap.sh gcc
  #     cd ..
  #
  #     # Run B2 build
  #     cd boost-source
  #     ./b2 \
  #       toolset=gcc-15 \
  #       cxxstd=20 \
  #       variant=release \
  #       address-model=64 \
  #       link=shared \
  #       libs/capy/test
  #   filter:
  #     - capy-root/**

  # - key: build-gcc-15-cmake
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     cd capy-root
  #     cmake -B __build__ \
  #       -DCMAKE_BUILD_TYPE=Release \
  #       -DCMAKE_CXX_STANDARD=20 \
  #       -DCMAKE_CXX_COMPILER=g++-15 \
  #       -DCMAKE_C_COMPILER=gcc-15
  #     cmake --build __build__ --target boost_capy_tests
  #     ctest --test-dir __build__
  #   filter:
  #     - capy-root/**

  # GCC 15 asan+ubsan: B2 build only (no build-cmake flag in GitHub Actions)
  # DISABLED: GCC 15 requires Ubuntu 25.04, which is not supported by rwx/base
  # - key: build-gcc-15-asan-ubsan
  #   use: [clone-capy, install-gcc-15]
  #   run: |
  #     # Setup Boost tree with capy integrated
  #     sudo apt-get install -y python3 python-is-python3
  #     git clone --depth 1 --branch develop https://github.com/boostorg/boost.git boost-source
  #     cd boost-source
  #     git submodule update --init --depth 1 tools/build tools/boostdep tools/boost_install
  #     cp -r ../capy-root libs/capy
  #     python3 tools/boostdep/depinst/depinst.py --git_args "--depth 1" capy
  #     ./bootstrap.sh gcc
  #     cd ..
  #
  #     # Disable ASLR for sanitizers
  #     sudo sysctl vm.mmap_rnd_bits=28 || true
